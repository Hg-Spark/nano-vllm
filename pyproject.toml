[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.3.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "A compact Qwen3.5-MoE hybrid inference runtime"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.14.0",
    "triton>=3.0.0",
    "transformers>=5.2.0",
    "flashinfer-python[cu13]==0.7.0",
    "safetensors",
]

[project.urls]
Homepage="https://github.com/Hg-Spark/nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
