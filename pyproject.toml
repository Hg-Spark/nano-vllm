[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.3.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "A compact Qwen3.5 hybrid inference runtime"
# Reference environment: Python 3.10-3.12, PyTorch 2.14.0, CUDA 13.0.
# These versions are documentation guidance, not installation constraints.
dependencies = [
    "torch",
    "triton>=3.0.0",
    "transformers>=5.2.0",
    "flashinfer-python==0.7.0",
    "safetensors",
    "Pillow",
]

[project.urls]
Homepage = "https://github.com/Hg-Spark/nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 100
