name: CI

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install ruff==0.14.4
      - name: Lint and import ordering
        run: ruff check --select E4,E7,E9,F,I nanovllm scripts tests benchmarks
      - name: Check formatting
        run: ruff format --check nanovllm scripts tests benchmarks || { ruff format --diff nanovllm scripts tests benchmarks; exit 1; }
      - name: Validate benchmark runner shell syntax
        run: bash -n benchmarks/run.sh benchmarks/run_tests.sh
      - name: Compile source and tests
        run: python -m compileall -q nanovllm scripts benchmarks tests
      - name: Check Markdown relative links
        run: python scripts/check_markdown_links.py

  cpu-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "transformers>=5.19.0" safetensors Pillow "pytest>=8.0"
      - name: Run unit tests (including pytest functions)
        run: python -B -m pytest tests/unit -q
