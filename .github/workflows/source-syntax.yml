name: Source syntax

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python without runtime dependencies
        run: python -m compileall -q nanovllm scripts benchmarks tests
      # Only stdlib-compatible modules belong in this environment; GPU tests run separately.
      - name: Run dependency-light CLI regression tests
        run: |
          python -B -m unittest \
            tests.unit.test_scripts \
            tests.unit.test_experiment_cli \
            tests.unit.test_diagnosis_script \
            tests.unit.test_experiment_measurement \
            tests.unit.test_bench_experiments \
            tests.unit.test_script_reporting \
            tests.unit.test_script_probes \
            tests.unit.test_llm_engine \
            tests.unit.test_config \
            tests.unit.test_context \
            tests.unit.test_prefill_batch \
            tests.unit.test_prefix_cache \
            tests.unit.test_state_manager \
            tests.unit.test_scheduler \
            tests.unit.test_scheduler_recovery \
            tests.unit.test_scheduler_prefix_cache \
            tests.unit.test_hybrid_resources \
            tests.unit.test_multimodal
      - name: Check Markdown relative links
        run: python scripts/check_markdown_links.py
