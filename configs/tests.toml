# Paths support ~ and environment variables; relative paths use the project root.
model = "~/models/Qwen3.5-2B"
gpu = "0"                         # CUDA_VISIBLE_DEVICES
stage = "check"                     # all, check, bench, tail, long, capacity
output_dir = "results"             # Each run creates a new run_* directory.

[benchmark]
mode = "smoke"                    # smoke or full; use stage=tail/long separately.
repeats = 5                       # Set 1 only for smoke; >=5 for formal A/B.

[kv_cache]
dtype = "auto"                   # auto (BF16 KV) or fp8_e4m3 (FP8 KV).
k_scale = 1.0                     # FP8 dequantization scale; calibrate before parity.
v_scale = 1.0                     # BF16 model compute is fixed independently.

[correctness]
max_jobs = 1                      # Parallel Ninja compiler jobs.
nvcc_threads = 1                  # Threads within each nvcc process.
prompt = "What is the capital of France?"
max_new_tokens = 32
max_model_len = 512
prefix_block_size = 16

[capacity]
max_batch = 64
budget = 512
input_len = 2048
output_len = 128
max_model_len = 4096
gpu_memory_utilization = 0.75
